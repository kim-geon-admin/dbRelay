[package]
name = "db-relay-desktop"
version = "0.1.0"
description = "A desktop database relay for safe migrations"
authors = ["DB Relay contributors"]
edition = "2021"

[lib]
name = "db_relay"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
test-support = []

[[test]]
name = "migration_runner"
path = "tests/migration_runner.rs"
required-features = ["test-support"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
