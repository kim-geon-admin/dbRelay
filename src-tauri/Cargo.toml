[package]
name = "db-relay-desktop"
version = "0.1.0"
description = "A desktop database relay for safe migrations"
authors = ["DB Relay contributors"]
edition = "2021"

[lib]
name = "db_relay"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
